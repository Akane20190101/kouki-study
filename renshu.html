<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4d8bff">
<title>練習問題</title>
<style>
  :root{
    --blue:#4d8bff;--blue-dark:#2f6ae0;--cream:#f4f9ff;--navy:#233047;
    --gray:#6b7488;--card:#ffffff;--line:#dbe7f7;
    --ok:#22b07a;--ok-bg:#e6f8f0;--ng:#ef5a6b;--ng-bg:#fdeaec;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    background:var(--cream);color:var(--navy);line-height:1.5;
    min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom);
  }
  ruby{ruby-align:center;} rt{font-size:.5em;font-weight:600;color:var(--gray);user-select:none;}

  header{
    position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;
    padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
    background:var(--blue);color:#fff;box-shadow:0 2px 10px rgba(77,139,255,.25);
  }
  .back{
    display:flex;align-items:center;justify-content:center;width:34px;height:34px;
    border-radius:10px;background:rgba(255,255,255,.2);color:#fff;text-decoration:none;
    font-size:20px;font-weight:900;flex:none;
  }
  .htitle{font-size:17px;font-weight:900;}

  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px;}  /* 下は 固定ボタンの ぶんだけ あける */

  .progress{display:flex;align-items:center;gap:10px;margin:4px 2px 10px;}
  .bar{flex:1;height:10px;border-radius:999px;background:#e3ecfa;overflow:hidden;}
  .bar > i{display:block;height:100%;width:0;background:var(--blue);border-radius:999px;transition:width .3s ease;}
  .count{font-size:13px;font-weight:800;color:var(--gray);white-space:nowrap;}

  .chip{
    display:inline-block;font-size:12px;font-weight:800;color:var(--blue-dark);
    background:#eaf2ff;padding:3px 11px;border-radius:999px;margin-bottom:7px;
  }
  .qnum{font-size:12px;color:var(--gray);font-weight:800;margin-bottom:5px;}
  .q{font-size:30px;font-weight:900;line-height:1.5;letter-spacing:.01em;min-height:74px;display:flex;flex-direction:column;justify-content:center;}
  /* かずの もんだいは 1ぎょうに おさめる（JSで じどう しゅくしょう）*/
  .q.fit{white-space:nowrap;overflow:hidden;}
  /* 3つずつの グループを きいろで かこむ */
  .ngrp{display:inline-flex;gap:9px;align-items:center;}
  .gbox{border:2.5px solid #f5b301;border-radius:12px;padding:4px 9px;
        background:rgba(245,179,1,.12);}
  .qmean{font-size:13px;color:#e0455a;font-weight:700;line-height:1.7;margin-top:6px;}

  /* たんご を「よみ／英語／いみ」で たてに かさね、1ぎょうに よこ ならび（もんだいの ことばは 大きく）*/
  .stem{display:flex;flex-wrap:nowrap;gap:10px;align-items:flex-start;justify-content:space-between;font-size:28px;}
  .wu{display:flex;flex-direction:column;align-items:center;text-align:center;flex:0 0 auto;}
  .wru{font-size:1em;font-weight:900;line-height:1.2;white-space:nowrap;}
  .wru rt{font-size:.4em;color:var(--gray);font-weight:700;}
  .wja{font-size:.44em;color:#e0455a;font-weight:700;margin-top:4px;line-height:1.3;}

  /* ことばの かんけい（A : B ＝ C : □）を 1ぎょうで */
  .astem{display:flex;flex-wrap:nowrap;align-items:center;justify-content:center;gap:6px;font-size:23px;}
  .au{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;flex:none;}
  .ay{font-size:.42em;color:var(--gray);font-weight:700;min-height:1.1em;line-height:1;white-space:nowrap;}
  .ae{font-size:1em;font-weight:900;white-space:nowrap;line-height:1.2;}
  .am{font-size:.42em;color:#e0455a;font-weight:700;min-height:1.1em;line-height:1.2;white-space:nowrap;}
  .asep{font-size:.7em;font-weight:900;color:var(--navy);flex:none;}
  .ablank{font-size:1em;font-weight:900;color:var(--navy);flex:none;}
  .qja{font-size:14px;color:var(--gray);font-weight:700;line-height:1.7;margin-top:8px;min-height:2.7em;}

  /* 選択肢は 横2れつの グリッド（たてを みじかく・よこを 活かす）*/
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:7px 8px;margin-top:12px;}
  .choice{
    display:flex;align-items:center;gap:9px;background:var(--card);
    border:2px solid var(--line);border-radius:12px;padding:8px 11px;min-height:46px;
    cursor:pointer;text-align:left;transition:transform .1s, border-color .15s, background .15s;
  }
  .choice:active{transform:scale(.98);}
  .choice .mk{
    flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;background:#eef3fb;color:var(--gray);font-size:12px;font-weight:900;
  }
  .ctxt{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .cen{font-size:14px;font-weight:800;color:var(--navy);}
  .cja{font-size:10.5px;color:var(--gray);font-weight:700;}
  .choice.correct{border-color:var(--ok);background:var(--ok-bg);}
  .choice.correct .mk{background:var(--ok);color:#fff;}
  .choice.wrong{border-color:var(--ng);background:var(--ng-bg);}
  .choice.wrong .mk{background:var(--ng);color:#fff;}
  .choices.locked .choice{cursor:default;}

  /* ===== 図形問題（SVG）===== */
  .figgrid{display:inline-grid;gap:7px;justify-content:center;margin:2px auto;}
  .figcell{width:60px;height:60px;border:2px solid #c7d5ea;border-radius:9px;
    display:flex;align-items:center;justify-content:center;background:#fff;}
  .figcell.empty{border:none;background:transparent;}
  .figq{font-size:28px;font-weight:900;color:var(--blue);}
  .fig{display:block;}
  .figtarget{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .figtarget .figcell{width:82px;height:82px;border-color:#7ec8f5;border-width:2.5px;}
  .figtlabel{font-size:11px;font-weight:900;color:var(--blue-dark);letter-spacing:.08em;}
  .choice.figchoice{justify-content:flex-start;gap:8px;min-height:60px;}
  .choice.figchoice .figcell{width:44px;height:44px;border:none;}
  /* 図形の 合成・変換もんだい */
  .compq{display:flex;flex-direction:column;align-items:center;gap:9px;margin:4px auto;}
  .comprow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;}
  .comprow .figcell{width:60px;height:60px;}
  .compop{font-size:23px;font-weight:900;color:var(--blue-dark);}
  .complbl{font-size:11px;font-weight:900;color:var(--blue-dark);background:#eef3fb;border-radius:8px;padding:2px 7px;}
  .choice.figchoice .compq{margin:0;}

  .explain{margin-top:8px;border-radius:14px;padding:8px 12px;font-size:10.5px;line-height:1.4;display:none;}
  .explain.show{display:block;}
  .explain.good{background:var(--ok-bg);color:#0e7a52;}
  .explain.bad{background:var(--ng-bg);color:#b02a3a;}
  .explain b{font-weight:900;}

  /* 「つぎへ」は 画面の 下に 固定 → 問題が かわっても ボタンの いちが ぜったい ズレない
     （連続で ポンポン おせる）。中身は うしろの padding-bottom で かぶらないように する。 */
  .next{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:max(12px, env(safe-area-inset-bottom));
    width:min(100% - 32px, 528px);z-index:60;
    display:block;padding:15px;border:none;border-radius:16px;
    background:var(--blue);color:#fff;font-size:19px;font-weight:900;cursor:pointer;
    box-shadow:0 8px 22px rgba(77,139,255,.45);
  }
  .next rt{color:rgba(255,255,255,.85);}
  .next:active{transform:translateX(-50%) scale(.98);box-shadow:0 3px 8px rgba(77,139,255,.3);}
  .next:focus-visible{outline:4px solid #ffd24d;outline-offset:3px;}  /* カーソルが 合ったのが 見てわかる */

  /* 🔊 タップで 英語を 読む（スマホは hover が ないので これで 確実に 鳴る）*/
  .hearbtn{
    display:none;margin:8px 0 2px;padding:9px 16px;border:2px solid var(--blue);border-radius:999px;
    background:#eaf1ff;color:var(--blue-dark);font-size:15px;font-weight:900;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .hearbtn.show{display:inline-block;}
  .hearbtn:active{transform:scale(.96);background:#d8e6ff;}
  .hearbtn.playing{background:var(--blue);color:#fff;}
  /* 選択肢を きく ボタンは 色ちがい（みどり）で 問題用と 区別 */
  .hearbtn-ch{border-color:#1a9d6b;background:#e5f7ee;color:#127a52;}
  .hearbtn-ch:active{background:#cdefdf;}
  .hearbtn-ch.playing{background:#1a9d6b;color:#fff;}
  @media (prefers-color-scheme: dark){ .hearbtn{background:#1c2740;} .hearbtn.playing{color:#fff;} .hearbtn-ch{background:#123028;} }

  /* 上バー：タイプ表示 ＋ 日本語訳トグル */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:7px;}
  .jatoggle{
    padding:7px 14px;border:2px solid #f0a500;border-radius:999px;
    background:#fff3d6;color:#a56b00;font-size:13px;font-weight:900;cursor:pointer;
    -webkit-tap-highlight-color:transparent;white-space:nowrap;
  }
  .jatoggle rt{color:#c98a20;font-size:.5em;}
  .jatoggle:active{transform:scale(.96);}
  .jatoggle.on{border-color:#12336e;background:#dcebfb;color:var(--blue-dark);}   /* 「つける」状態は 青 */
  .jatoggle.on rt{color:#3a6fd0;}
  @media (prefers-color-scheme: dark){ .jatoggle{background:#3a2f12;color:#f0c060;} .jatoggle.on{background:#17293f;color:#8fb6f0;} }
  /* 日本語訳を かくす（意味・訳を 消す。英単語と カタカナ読みは のこす）*/
  #quiz.hide-ja .wja,
  #quiz.hide-ja .am,
  #quiz.hide-ja .cja,
  #quiz.hide-ja .qmean{ display:none !important; }

  .home-foot{
    display:block;text-align:center;margin-top:12px;padding:8px;
    color:var(--gray);text-decoration:none;font-size:14px;font-weight:800;
  }
  .home-foot:active{opacity:.6;}

  .result{display:none;text-align:center;padding:30px 10px;}
  .result.show{display:block;}
  .result .big{font-size:64px;line-height:1;}
  .result h2{font-size:26px;font-weight:900;margin:14px 0 6px;}
  .result .score{font-size:20px;font-weight:900;color:var(--blue-dark);margin-bottom:6px;}
  .result .msg{font-size:15px;color:var(--gray);margin-bottom:24px;}
  .result .btns{display:flex;flex-direction:column;gap:10px;}
  .btn{display:block;padding:15px;border-radius:16px;font-size:17px;font-weight:900;text-decoration:none;cursor:pointer;border:none;}
  .btn.primary{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(77,139,255,.3);}
  .btn.warn{background:#f5a623;color:#fff;box-shadow:0 4px 12px rgba(245,166,35,.3);}
  .btn.warn rt{color:rgba(255,255,255,.85);}
  .btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line);}
  .ennote{font-size:11px;color:#e0455a;font-weight:700;text-align:center;margin-top:-4px;}

  @media (prefers-color-scheme: dark){
    :root{
      --cream:#141a24;--navy:#eef3fb;--gray:#9aa5b6;--card:#1c2531;--line:#2c3849;--blue-dark:#8ab4ff;
      --ok-bg:#183226;--ng-bg:#361d22;
    }
    .choice .mk{background:#26344a;} .chip{background:#26344a;} .bar{background:#26344a;}
    .explain.good{color:#7fe3b6;} .explain.bad{color:#ff9aa6;} .btn.ghost{background:#1c2531;}
    .qmean{color:#ff9aa6;}
  }
  /* ===== パソコン（大きい画面）は 画面を ひろく使う ===== */
  @media (min-width: 760px){
    .wrap{max-width:720px;padding:26px 32px 110px;}
    .htitle{font-size:19px;}
    .q{font-size:36px;}
    .cen{font-size:16px;}
    .choice{padding:11px 18px;}
    .mk{width:26px;height:26px;font-size:14px;}
    .cja{font-size:12px;}
    .qja{font-size:16px;}
    .qmean{font-size:15px;}
    .next{font-size:20px;padding:18px;width:min(100% - 64px, 656px);}
    .stem{font-size:34px;}
    .astem{font-size:28px;}
    .explain{font-size:14px;}
  }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">‹</a>
  <div class="htitle"><ruby>練習問題<rt>れんしゅうもんだい</rt></ruby>（CAT4 レベルF）</div>
</header>

<div class="wrap">
  <div id="quiz">
    <div class="progress">
      <div class="bar"><i id="barfill"></i></div>
      <div class="count" id="count">1 / 1</div>
    </div>
    <div class="topbar">
      <div class="chip" id="chip">タイプ</div>
      <button class="jatoggle" id="jaToggle" type="button"><ruby>日本語訳<rt>にほんごやく</rt></ruby>を <ruby>隠<rt>かく</rt></ruby>す 🙈</button>
    </div>
    <div class="qnum" id="qnum">もんだい 1</div>
    <div class="q" id="question">…</div>
    <div class="qmean" id="qmean"></div>
    <div class="qja" id="qja"></div>
    <button class="hearbtn" id="hearBtn" type="button">🔊 <ruby>問題<rt>もんだい</rt></ruby>を きく</button>
    <button class="hearbtn hearbtn-ch" id="hearChoicesBtn" type="button">🔊 せんたくしを きく</button>
    <div class="choices" id="choices"></div>
    <button class="next" id="next">つぎへ ›</button>
    <div class="explain" id="explain"></div>
    <a class="home-foot" href="index.html">🏠 ホームにもどる</a>
  </div>

  <div class="result" id="result">
    <div class="big" id="resface">🎉</div>
    <h2 id="restitle">おわり！</h2>
    <div class="score" id="resscore"></div>
    <div class="msg" id="resmsg"></div>
    <div class="btns">
      <button class="btn primary" id="again">もういちど やる 🔁</button>
      <button class="btn warn" id="retryWrong">まちがえた もんだいだけ もう<ruby>一度<rt>いちど</rt></ruby> ❌</button>
      <button class="btn ghost" id="retryEn"><ruby>日本語<rt>にほんご</rt></ruby>やく なしで やる 🔤</button>
      <div class="ennote" id="ennote">（<ruby>本番<rt>ほんばん</rt></ruby>は<ruby>日本語<rt>にほんご</rt></ruby>は ないよ）</div>
      <a class="btn ghost" href="index.html">ホームへ もどる 🏠</a>
    </div>
  </div>
</div>

<script>
// ===== CAT4 レベルF 練習問題（本番と同じ英語＋日本語やく・オリジナル）=====
// 本番はすべて英語。日本語は りかいを たすける「やく」です。
const VC = "ことばの なかま（Verbal Classification）";
const VA = "ことばの かんけい（Verbal Analogies）";
const NA = "かずの かんけい（Number Analogies）";
const NS = "かずの ならび（Number Series）";
const FC = "図形の なかま（Figure Classification）";
const FM = "図形の きまり（Figure Matrices）";
const FA = "紙を おって（Figure Analysis）";
const FR = "おなじ図形（Figure Recognition）";
const FG = "図形：かさねる（合成）";
const FT = "図形：かたちを かえる（変換）";

const DAY1 = [
  // ---- Verbal Classification（3つと なかまの ことばを えらぶ）----
  { cat:VC, stem:[
      {en:"diminish", yomi:"ディミニッシュ", ja:"へる"},
      {en:"dwindle", yomi:"ドウィンドル", ja:"だんだん すくなくなる"},
      {en:"subside", yomi:"サブサイド", ja:"おさまる"},
    ],
    qja:"<ruby>仲間<rt>なかま</rt></ruby>になる<ruby>言葉<rt>ことば</rt></ruby>は<ruby>以下<rt>いか</rt></ruby>のどれ？",
    choices:[
      {en:"collapse", yomi:"コラプス", ja:"くずれる"},
      {en:"reduce", yomi:"リデュース", ja:"へらす"},
      {en:"fade", yomi:"フェイド", ja:"うすれる"},
      {en:"wane", yomi:"ウェイン", ja:"おとろえる"},
      {en:"deteriorate", yomi:"ディテリオレイト", ja:"わるくなる"},
    ], answer:3,
    ex:"<b>wane</b> は「（ちからや つきが）だんだん へって よわまる」いみ。diminish・dwindle・subside と おなじで、ポイントは「<b>りょう・いきおいが へる</b>」こと。ほかが ちがうわけ：<br>・collapse＝きゅうに くずれる（だんだん じゃない）<br>・reduce＝なにかを へらす（ひとりでに じゃない）<br>・<b>fade</b>＝いろ・おと・きおくが「うすれて きえる」こと。りょうが へるのとは べつ<br>・<b>deteriorate</b>＝「しつ（じょうたい）が わるくなる」だけ。りょうは へらない" },

  { cat:VC, stem:[
      {en:"anxious", yomi:"アングシャス", ja:"ふあんな"},
      {en:"nervous", yomi:"ナーバス", ja:"きんちょうした"},
      {en:"uneasy", yomi:"アンイージー", ja:"おちつかない"},
    ],
    qja:"<ruby>仲間<rt>なかま</rt></ruby>になる<ruby>言葉<rt>ことば</rt></ruby>は<ruby>以下<rt>いか</rt></ruby>のどれ？",
    choices:[
      {en:"calm", yomi:"カーム", ja:"おちついた"},
      {en:"apprehensive", yomi:"アプリヘンシブ", ja:"きがかりな"},
      {en:"confident", yomi:"コンフィデント", ja:"じしんがある"},
      {en:"relaxed", yomi:"リラックスト", ja:"ゆったりした"},
      {en:"bored", yomi:"ボアド", ja:"たいくつな"},
    ], answer:1,
    ex:"<b>apprehensive</b> は「わるいことが おきそうで ふあん」。anxious・nervous・uneasy と おなじ ふあんの なかま。ほかが ちがうわけ：<br>・calm／relaxed＝おちついている（はんたい）<br>・confident＝じしんが ある<br>・bored＝たいくつ（ふあんとは べつ）" },

  { cat:VC, stem:[
      {en:"enormous", yomi:"イノーマス", ja:"きょだいな"},
      {en:"immense", yomi:"イメンス", ja:"ばくだいな"},
      {en:"gigantic", yomi:"ジャイガンティック", ja:"とても おおきい"},
    ],
    qja:"<ruby>仲間<rt>なかま</rt></ruby>になる<ruby>言葉<rt>ことば</rt></ruby>は<ruby>以下<rt>いか</rt></ruby>のどれ？",
    choices:[
      {en:"tiny", yomi:"タイニー", ja:"ちいさい"},
      {en:"vast", yomi:"ヴァスト", ja:"こうだいな"},
      {en:"narrow", yomi:"ナロー", ja:"せまい"},
      {en:"brief", yomi:"ブリーフ", ja:"みじかい"},
      {en:"minor", yomi:"マイナー", ja:"ささいな"},
    ], answer:1,
    ex:"<b>vast</b> は「とても ひろい・きょだい」。enormous・immense・gigantic と おなじ「おおきい」なかま。ほかが ちがうわけ：<br>・tiny＝ちいさい（はんたい）<br>・narrow＝せまい（はんたい）<br>・brief＝みじかい（じかんの はなし）<br>・minor＝ささい（じゅうようどの はなし）" },

  { cat:VC, stem:[
      {en:"brave", yomi:"ブレイブ", ja:"ゆうかんな"},
      {en:"bold", yomi:"ボールド", ja:"だいたんな"},
      {en:"courageous", yomi:"カレイジャス", ja:"ゆうきの ある"},
    ],
    qja:"<ruby>仲間<rt>なかま</rt></ruby>になる<ruby>言葉<rt>ことば</rt></ruby>は<ruby>以下<rt>いか</rt></ruby>のどれ？",
    choices:[
      {en:"timid", yomi:"ティミッド", ja:"おくびょうな"},
      {en:"reckless", yomi:"レックレス", ja:"むちゃな"},
      {en:"valiant", yomi:"ヴァリアント", ja:"ゆうかんな"},
      {en:"cautious", yomi:"コーシャス", ja:"しんちょうな"},
      {en:"feeble", yomi:"フィーブル", ja:"よわよわしい"},
    ], answer:2,
    ex:"<b>valiant</b> は「ゆうかんな」。brave・bold・courageous と おなじ なかま。ほかが ちがうわけ：<br>・timid＝おくびょう（はんたい）<br>・reckless＝むちゃ・むぼう（ゆうかんとは ちがう）<br>・cautious＝しんちょう（べつの いみ）<br>・feeble＝よわよわしい（はんたい）" },

let enVoice = null;
function pickEnVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    // アメリカ英語(en-US)の 女性の声だけ えらぶ（いつも 同じ 女性が 読むように）。
    const isUS = v => /en[-_]US/i.test(v.lang);
    // よく ある 女性の アメリカ英語の 声（Mac / Windows / Android）
    const FEMALE = /Samantha|Ava|Allison|Susan|Zoe|Nicky|Joelle|Kathy|Vicki|Victoria|Zira|Aria|Jenny|Michelle|Google US English/i;
    // 男性の声（これは えらばない）
    const MALE = /David|Mark|Guy|Eric|Tom|Alex|Fred|Evan|Nathan|Aaron|Daniel|Oliver|James|Bruce|Lee|Reed|Rocko|Junior|Ralph|Albert|Arthur|Gordon/i;
    // ふざけた声（これも えらばない）
    const NOVELTY = /Bad News|Good News|Bahh|Boing|Bells|Bubbles|Cellos|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Grandma|Grandpa|Sandy|Shelley|Flo|Eddy|ささやき|オルガン|スーパースター|トリノイド|ベル|道化|震え/i;
    enVoice = vs.find(v => isUS(v) && /Samantha/i.test(v.name))          // Mac 定番の 女性の声
           || vs.find(v => isUS(v) && FEMALE.test(v.name))               // ほかの 女性の アメリカ英語
           || vs.find(v => isUS(v) && !MALE.test(v.name) && !NOVELTY.test(v.name))  // アメリカ英語で 男性・ふざけ以外
           || vs.find(v => /^en/i.test(v.lang) && FEMALE.test(v.name))   // en なら 女性名を さがす
           || vs.find(v => isUS(v))                                       // 最後は どの アメリカ英語でも
           || null;
  }catch(e){}
}
pickEnVoice();

// しゃべらせる 中心の 関数。デスクトップで 音が 出ない 既知バグを つぶす：
//  ① utterance を 変数に つかまえておく（GCで 消えて 無音に なるのを 防ぐ）
//  ② 声の 指定で 失敗したら 声なし（ブラウザ既定）で もう一度
//  ③ 声リストが まだ 空なら すこし 待って 読む
const _uKeep = [];
function _rawSpeak(text, useVoice){
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    if(useVoice && enVoice) u.voice = enVoice;
    u.rate = 0.9;
    const drop = () => { const i = _uKeep.indexOf(u); if(i >= 0) _uKeep.splice(i, 1); };
    u.onend = drop;
    u.onerror = drop;                     // 失敗しても 別の声で 読み直さない（二重読み・別人声を ふせぐ）
    _uKeep.push(u);                       // ①GC対策：参照を のこす
    speechSynthesis.speak(u);
  }catch(e){}
}
function _speakList(texts){
  try{
    if(!('speechSynthesis' in window)) return;
    texts = (texts || []).map(t => t == null ? '' : String(t)).filter(t => t.trim());
    if(!texts.length) return;
    if(!enVoice) pickEnVoice();
    try{ speechSynthesis.resume(); }catch(e){}
    const run = () => {
      if(!enVoice) pickEnVoice();
      texts.forEach(t => _rawSpeak(t, true));
    };
    if(!speechSynthesis.getVoices().length){    // ③声がまだ来てない→少し待つ
      setTimeout(run, 200); return;
    }
    if(speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();                 // iOS：cancel直後は 少し待ってから
      setTimeout(run, 140);
    }else{
      run();
    }
  }catch(e){}
}
function speak(text){ if(text) _speakList([text]); }
// 選択肢を ぜんぶ じゅんばんに 読む

function questionEnglish(item){

}

// ===== サウンド（正解＝歓声／不正解＝残念）=====
let actx;
function actxGet(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f, t, dur, vol, type){
  const c = actxGet(); const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
}
function correctSound(){                 // 正解：ファンファーレ＋歓声
  try{
    const c = actxGet(), base = c.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => tone(f, base + i * 0.09, 0.32, 0.16, 'triangle'));
    const dur = 0.7;                      // 「わーい！」の 歓声（ホワイトノイズ）
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1600; bp.Q.value = 0.5;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, base);
    g.gain.exponentialRampToValueAtTime(0.09, base + 0.2);
    g.gain.exponentialRampToValueAtTime(0.0008, base + dur);
    src.connect(bp); bp.connect(g); g.connect(c.destination); src.start(base); src.stop(base + dur);
  }catch(e){}
}
function wrongSound(){                    // 不正解：やさしい「ざんねん…」下降音
  try{

// ===== 図形（SVG）えがき：矢印・多角形・星・ドット、黒（塗り）／白（枠）、内側図形 =====
const FIG_FILL = '#1f2430';   // 「黒」と 言葉が 合うように 黒に ちかい 色（枠だけの ときは 白ぬき）
function _poly(n, r, cx, cy, rotDeg){
  let p = [];
  for(let i = 0; i < n; i++){
    const a = (-90 + rotDeg + i*360/n) * Math.PI/180;
    p.push((cx + r*Math.cos(a)).toFixed(1) + ',' + (cy + r*Math.sin(a)).toFixed(1));
  }
  return p.join(' ');
}
function _star(pts, ro, ri, cx, cy, rotDeg){
  let p = [];
  for(let i = 0; i < 2*pts; i++){
    const r = (i % 2 === 0) ? ro : ri;
    const a = (-90 + rotDeg + i*180/pts) * Math.PI/180;
    p.push((cx + r*Math.cos(a)).toFixed(1) + ',' + (cy + r*Math.sin(a)).toFixed(1));
  }
  return p.join(' ');
}
function _fillAttr(fill){
  return fill === false ? 'fill="none" stroke="'+FIG_FILL+'" stroke-width="4"'
                        : 'fill="'+FIG_FILL+'"';
}
// 4分割の 丸の 中に おく 小さい しるし（星・丸・三角・四角）。x,y は 中心。
function _icon(ic, x, y){
  const r = 9;
  if(ic === 'dot')  return '<circle cx="'+x+'" cy="'+y+'" r="6.5" fill="'+FIG_FILL+'"/>';
  if(ic === 'star') return '<polygon points="'+_star(5, r, r*0.42, x, y, 0)+'" fill="'+FIG_FILL+'"/>';
  if(ic === 'tri')  return '<polygon points="'+_poly(3, r, x, y, 0)+'" fill="'+FIG_FILL+'"/>';
  if(ic === 'sq')   return '<rect x="'+(x-r*0.8)+'" y="'+(y-r*0.8)+'" width="'+(r*1.6)+'" height="'+(r*1.6)+'" fill="'+FIG_FILL+'"/>';
  return '';
}
function figShape(s){
  if(!s || s === '?') return '';
  const cx = 50, cy = 50;
  const R = s.size === 'xs' ? 13 : s.size === 's' ? 20 : s.size === 'l' ? 40 : 32;
  const f = _fillAttr(s.fill);
  let body = '';
  switch(s.shape){
    case 'circle':   body = '<circle cx="50" cy="50" r="'+R+'" '+f+'/>'; break;
    case 'square':   { const a = R*1.7; body = '<rect x="'+(50-a/2).toFixed(1)+'" y="'+(50-a/2).toFixed(1)+'" width="'+a.toFixed(1)+'" height="'+a.toFixed(1)+'" '+f+'/>'; } break;
    case 'diamond':  body = '<polygon points="'+_poly(4, R, cx, cy, 0)+'" '+f+'/>'; break;
    case 'triangle': { const rot = {up:0, down:180, left:-90, right:90}[s.dir||'up']; body = '<polygon points="'+_poly(3, R, cx, cy, rot)+'" '+f+'/>'; } break;
    case 'pentagon': body = '<polygon points="'+_poly(5, R, cx, cy, s.dir==='down'?180:0)+'" '+f+'/>'; break;
    case 'hexagon':  body = '<polygon points="'+_poly(6, R, cx, cy, 0)+'" '+f+'/>'; break;
    case 'octagon':  body = '<polygon points="'+_poly(8, R, cx, cy, 22.5)+'" '+f+'/>'; break;
    case 'star':     body = '<polygon points="'+_star(s.points||5, R, R*0.42, cx, cy, s.rot||0)+'" '+f+'/>'; break;
    case 'arrow':    {
      const rot = {up:0, right:90, down:180, left:270}[s.dir||'up'];
      body = '<g transform="rotate('+rot+' 50 50)"><polygon points="50,12 78,42 63,42 63,86 37,86 37,42 22,42" '+f+'/></g>';
    } break;
    case 'dots':     {
      const n = s.n||1, arr = s.arrange||'v', dr = 7;
      let cs = [];
      if(arr === 'v'){ const ys = n===1?[50]:n===2?[38,62]:[30,50,70]; ys.forEach(y => cs.push([50,y])); }
      else if(arr === 'h'){ const xs = n===1?[50]:n===2?[38,62]:[30,50,70]; xs.forEach(x => cs.push([x,50])); }
      else if(arr === 'tri'){ cs = [[50,32],[36,64],[64,64]]; }
      else if(arr === 'sq'){ cs = [[36,36],[64,36],[36,64],[64,64]]; }
      body = cs.map(c => '<circle cx="'+c[0]+'" cy="'+c[1]+'" r="'+dr+'" fill="'+FIG_FILL+'"/>').join('');
    } break;
    case 'quad':     {   // ×で 4分割した 丸＋各エリアに 小さい しるし（回転もんだい用）
      body = '<circle cx="50" cy="50" r="40" fill="none" stroke="'+FIG_FILL+'" stroke-width="3"/>';
      const dd = 28.3;    // 40/√2
      body += '<line x1="'+(50-dd)+'" y1="'+(50-dd)+'" x2="'+(50+dd)+'" y2="'+(50+dd)+'" stroke="'+FIG_FILL+'" stroke-width="2.5"/>';
      body += '<line x1="'+(50-dd)+'" y1="'+(50+dd)+'" x2="'+(50+dd)+'" y2="'+(50-dd)+'" stroke="'+FIG_FILL+'" stroke-width="2.5"/>';
      const ctr = [[50,26],[74,50],[50,74],[26,50]];   // 上・右・下・左
      (s.icons||[]).forEach((ic, qi) => { if(ic) body += _icon(ic, ctr[qi][0], ctr[qi][1]); });
    } break;
  }
  if(s.accent){   // すみに 小さい アクセント・ドット
    const pos = {tr:[80,20], tl:[20,20], top:[50,14], right:[84,50]}[s.accent.at||'tr'] || [80,20];
    const nn = s.accent.n || 1;
    for(let k = 0; k < nn; k++) body += '<circle cx="'+(pos[0]+k*9)+'" cy="'+pos[1]+'" r="4.5" fill="'+FIG_FILL+'"/>';
  }
  if(s.inner) body += figShape(Object.assign({}, s.inner, {size:'xs'}));
  return body;
}
function figSVG(s, px){
  return '<svg class="fig" width="'+px+'" height="'+px+'" viewBox="0 0 100 100">'+figShape(s)+'</svg>';
}
function figCell(c, px, cls){
  if(c === '?') return '<div class="figcell '+(cls||'')+'"><span class="figq">?</span></div>';
  if(!c) return '<div class="figcell empty"></div>';
  return '<div class="figcell '+(cls||'')+'">'+figSVG(c, px)+'</div>';
}

// ===== 本格 図形エンジン：合成（重ねる）と 変換（回転・鏡・白黒反転）=====
// 図形は {p:[パーツ…], spin, flip} で あらわす。パーツは figShape が えがける オブジェクト＋ dx,dy,sc（位置・大きさ）。
function _partTf(p){
  let t = '';
  if(p.dx || p.dy) t += 'translate('+(p.dx||0)+' '+(p.dy||0)+') ';
  if(p.sc && p.sc !== 1) t += 'translate('+(50*(1-p.sc)).toFixed(2)+' '+(50*(1-p.sc)).toFixed(2)+') scale('+p.sc+') ';
  return t.trim();
}
function figFig(f){
  const inner = (f.p || []).map(p => { const t = _partTf(p); const b = figShape(p); return t ? '<g transform="'+t+'">'+b+'</g>' : b; }).join('');
  let g = '';
  if(f.spin) g += 'rotate('+f.spin+' 50 50) ';
  if(f.flip === 'h') g += 'translate(100 0) scale(-1 1) ';
  if(f.flip === 'v') g += 'translate(0 100) scale(1 -1) ';
  return g ? '<g transform="'+g.trim()+'">'+inner+'</g>' : inner;
}
function compSVG(f, px){ return '<svg class="fig" width="'+px+'" height="'+px+'" viewBox="0 0 100 100">'+figFig(f)+'</svg>'; }
function compCell(f, px, cls){ return '<div class="figcell '+(cls||'')+'">'+compSVG(f, px)+'</div>'; }

// 変換ヘルパー（関数宣言＝どこからでも 呼べる ように しておく）
function _tog(p){ return ('fill' in p) ? Object.assign({}, p, {fill: !p.fill}) : p; }
function _spin(f, d){ return { p: f.p, spin: ((((f.spin||0)+d)%360)+360)%360, flip: f.flip }; }
function _flip(f, ax){ return { p: f.p, spin: f.spin, flip: ax }; }
// マーカー（目じるしの ドット）の 位置。上下左右の まん中の へりに 大きめに おく → 回転・鏡が はっきり わかる。
function _corner(c){ return ({ top:[0,-25], right:[25,0], bottom:[0,25], left:[-25,0], tr:[18,-18], br:[18,18], bl:[-18,18], tl:[-18,-18] })[c || 'top']; }

// 合成（重ねる）もんだいを つくる：大きい形 big の 中に 小さい形 small。wrong は まちがい用の 小さい形。
function OV(big, small, wrong){
  const A = {p:[big]}, B = {p:[small]};
  return { cat:FG, comp:{ kind:'overlay', a:A, b:B },
    qja:"2つの 図形を <b>かさねる</b>と どう なる？（そとの 大きい 形＋なかの 小さい 形）",
    choices:[ {p:[big, small]}, A, B, {p:[big, wrong]}, {p:[wrong, small]} ], answer:0 };
}
// 変換ベース：まる＋やじるし＋すみのドット（むきが よく わかる。回転・鏡で 5つ とも 見た目が ちがう）
function AB(dir, corner){ const d = _corner(corner); return {p:[ {shape:'circle',fill:false}, {shape:'arrow',dir:dir,fill:true,sc:0.48}, {shape:'circle',fill:true,sc:0.26,dx:d[0],dy:d[1]} ]}; }
// 変換ベース：四角＋三角ポインタ＋すみのドット
function SB(dir, corner){ const d = _corner(corner); return {p:[ {shape:'square',fill:false}, {shape:'triangle',dir:dir,fill:true,sc:0.42}, {shape:'circle',fill:true,sc:0.24,dx:d[0],dy:d[1]} ]}; }
// 白黒反転ベース：黒い 外形＋中に 白い 丸（回転すると むきが ちがうので せんたくしが かぶらない）
function IB(shape, dir){ return {p:[ {shape:shape, dir:dir, fill:true}, {shape:'circle', fill:false, sc:0.5} ]}; }

// 回転（右に90ど）もんだい
function ROT(exBase, qBase){
  return { cat:FT, comp:{ kind:'transform', ex1:exBase, ex2:_spin(exBase,90), q:qBase },
    qja:"上の れいは 図形を <b>右に 90ど</b> まわしているよ。下の 図形を 同じ ように まわすと？",
    choices:[ _spin(qBase,90), qBase, _spin(qBase,180), _spin(qBase,270), _flip(qBase,'h') ], answer:0 };
}
// 鏡（左右さかさ）もんだい
function MIR(exBase, qBase){
  // こたえ（左右さかさ）は やじるしの むきが 5つの 中で ただ 1つに なるように する。
  return { cat:FT, comp:{ kind:'transform', ex1:exBase, ex2:_flip(exBase,'h'), q:qBase },
    qja:"上の れいは 図形を <b>左右 さかさ（鏡）</b>に しているよ。下の 図形を 同じ ように すると？",
    choices:[ _flip(qBase,'h'), qBase, _flip(qBase,'v'), _spin(qBase,90), _spin(qBase,270) ], answer:0 };
}
// 白黒反転もんだい
function INV(exBase, qBase){
  return { cat:FT, comp:{ kind:'transform', ex1:exBase, ex2:{p:exBase.p.map(_tog)}, q:qBase },
    qja:"上の れいは <b>黒と 白を 入れかえて</b>いるよ。下の 図形も 同じ ように すると？",
    choices:[ {p:qBase.p.map(_tog)}, qBase, {p:[_tog(qBase.p[0]), qBase.p[1]]}, {p:[qBase.p[0], _tog(qBase.p[1])]}, _spin(qBase,90) ], answer:0 };
}

// 白ぬき（outline）パーツの ショートカット
function _O(shape, ex){ return Object.assign({shape:shape, fill:false}, ex||{}); }

// ===== 折り紙（Figure Analysis）エンジン：紙を おって 穴を あけ、ひらいた 形を あてる =====
// fold = { n:4, axis:'v'|'h'|'vh', punches:[[r,c],...] }（punches は「おった あとの 紙」の マスめ）。
// おりめ を さかいに 穴が 鏡うつしに ふえる。axis に v が あれば 左右、h が あれば 上下に うつる。
function foldHoles(fold){
  const n = fold.n || 4, ax = fold.axis;
  const out = [];
  const add = (r, c) => { if(!out.some(p => p[0]===r && p[1]===c)) out.push([r, c]); };
  (fold.punches || []).forEach(([r, c]) => {
    let set = [[r, c]];
    if(ax.indexOf('v') >= 0) set = set.concat(set.map(([rr, cc]) => [rr, n-1-cc]));  // 左右の 鏡うつし
    if(ax.indexOf('h') >= 0) set = set.concat(set.map(([rr, cc]) => [n-1-rr, cc]));  // 上下の 鏡うつし
    set.forEach(([rr, cc]) => add(rr, cc));
  });
  return out;
}
// ひらいた 正方形（n×n）に 穴（●）を うつ SVG。選択肢＆正解の 表示に つかう。
function paperSquareSVG(holes, n, px){
  const pad = 12, span = 100 - 2*pad, cell = span / n;
  let s = '<svg class="fig" width="'+px+'" height="'+px+'" viewBox="0 0 100 100">';
  s += '<rect x="'+pad+'" y="'+pad+'" width="'+span+'" height="'+span+'" fill="#fff" stroke="'+FIG_FILL+'" stroke-width="3"/>';
  for(let i = 1; i < n; i++){   // うすい おりめ めやす線
    const p = pad + i*cell;
    s += '<line x1="'+p+'" y1="'+pad+'" x2="'+p+'" y2="'+(100-pad)+'" stroke="#e2e8f0" stroke-width="1"/>';
    s += '<line x1="'+pad+'" y1="'+p+'" x2="'+(100-pad)+'" y2="'+p+'" stroke="#e2e8f0" stroke-width="1"/>';
  }
  (holes || []).forEach(([r, c]) => {
    const x = pad + (c+0.5)*cell, y = pad + (r+0.5)*cell;
    s += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(cell*0.28).toFixed(1)+'" fill="'+FIG_FILL+'"/>';
  });
  return s + '</svg>';
}
// おった あとの 紙（問題の 図）。おりめ を 青い 点線、あけた 穴を ○ で しめす。
function foldedPaperSVG(fold, px){
  const n = fold.n || 4, ax = fold.axis;
  const fcols = ax.indexOf('v') >= 0 ? n/2 : n;
  const frows = ax.indexOf('h') >= 0 ? n/2 : n;
  const cell = 76 / n, w = fcols*cell, h = frows*cell;
  const x0 = (100 - w)/2, y0 = (100 - h)/2;
  let s = '<svg class="fig" width="'+px+'" height="'+px+'" viewBox="0 0 100 100">';
  s += '<rect x="'+x0.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="#eef3fb" stroke="'+FIG_FILL+'" stroke-width="3"/>';
  if(ax.indexOf('v') >= 0){ const fx = x0 + w; s += '<line x1="'+fx.toFixed(1)+'" y1="'+y0.toFixed(1)+'" x2="'+fx.toFixed(1)+'" y2="'+(y0+h).toFixed(1)+'" stroke="#3b82f6" stroke-width="3" stroke-dasharray="5 4"/>'; }
  if(ax.indexOf('h') >= 0){ const fy = y0 + h; s += '<line x1="'+x0.toFixed(1)+'" y1="'+fy.toFixed(1)+'" x2="'+(x0+w).toFixed(1)+'" y2="'+fy.toFixed(1)+'" stroke="#3b82f6" stroke-width="3" stroke-dasharray="5 4"/>'; }
  (fold.punches || []).forEach(([r, c]) => {
    const x = x0 + (c+0.5)*cell, y = y0 + (r+0.5)*cell;
    s += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(cell*0.26).toFixed(1)+'" fill="#fff" stroke="'+FIG_FILL+'" stroke-width="3"/>';
  });
  return s + '</svg>';
}
function paperCell(holes, n, px){ return '<div class="figcell">'+paperSquareSVG(holes, n, px)+'</div>'; }

// 選択肢の ならびを シャッフル（こたえが いつも おなじ いちに ならないように）
function shuffleAllChoices(){
  QUESTIONS.forEach(item => {
    const correct = item.choices[item.answer];
    for(let i = item.choices.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [item.choices[i], item.choices[j]] = [item.choices[j], item.choices[i]];
    }
    item.answer = item.choices.indexOf(correct);
  });
}

// 日本語訳なしモード（renshu.html?mode=en または renshu.html#en）
const noJa = new URLSearchParams(location.search).get('mode') === 'en'
  || location.hash === '#en';
const ENG = {
  [VC]: {chip:"Verbal Classification", ins:"Choose the word that belongs with the three words."},
  [VA]: {chip:"Verbal Analogies", ins:"Choose the word that completes the second pair."},
  [NA]: {chip:"Number Analogies", ins:"Find the missing number that follows the same rule."},
  [NS]: {chip:"Number Series", ins:"Choose the number that comes next."},
  [FC]: {chip:"Figure Classification", ins:"Choose the figure that completes the pattern."},
  [FM]: {chip:"Figure Matrices", ins:"Choose the figure that completes the grid."},
  [FA]: {chip:"Figure Analysis", ins:"The paper is folded and a hole is punched. Choose how it looks unfolded."},
  [FR]: {chip:"Figure Recognition", ins:"Choose the figure that matches the target exactly."},
  [FG]: {chip:"Figure Composition", ins:"Combine the two figures. Choose the result."},
  [FT]: {chip:"Figure Transformation", ins:"Apply the same change as the example, then choose the answer."},
};
if(noJa){
  const t = document.querySelector('.htitle');
  if(t) t.insertAdjacentHTML('beforeend', ' <span style="font-size:12px;font-weight:700;opacity:.85">・<ruby>英語<rt>えいご</rt></ruby>のみ</span>');
}
// 長い ぶんは 1ぶんしょうごと（。）に かいぎょう
const brk = s => (s||"").replace(/。/g, '。<br>').replace(/(<br>)+$/, '');

// もんだいが 画面から きれないよう、はばに あわせて 文字サイズを じどうちょうせい
function fitQuestion(){
  const q = document.getElementById('question');
  q.style.fontSize = '';
  if(!q.classList.contains('fit')) return;
  let size = 30;
  q.style.fontSize = size + 'px';
  while(q.scrollWidth > q.clientWidth && size > 11){
    size -= 0.5;
    q.style.fontSize = size + 'px';
  }
}
// ことばの もんだい（stem／astem）も 1ぎょうに おさまるよう じどうで ちぢめる
function fitStem(){
  const q = document.getElementById('question');
  const el = q.querySelector('.stem, .astem');
  if(!el) return;
  const base = el.classList.contains('astem') ? 23 : 28;
  let size = base;
  el.style.fontSize = size + 'px';
  while(el.scrollWidth > el.clientWidth && size > 10){
    size -= 0.5;
    el.style.fontSize = size + 'px';
  }
}
function fitAll(){ fitQuestion(); fitStem(); }
window.addEventListener('resize', fitAll);

function render(){
  try{ speechSynthesis.cancel(); }catch(e){}   // 前のページの 読み上げを かならず 止める（次ページに 声が のこらないように）
  const item = QUESTIONS[order[idx]];
  locked = false;
  $("chip").textContent = (noJa && ENG[item.cat]) ? ENG[item.cat].chip : item.cat;
  $("qnum").textContent = "もんだい " + (idx+1);
  if(item.fig){
    let figHtml = '';
    if(item.fig.target){
      figHtml = '<div class="figtarget"><div class="figcell">'+figSVG(item.fig.target, 70)+'</div><div class="figtlabel">TARGET</div></div>';
    } else {
      const cols = item.fig.cols || 3;
      figHtml = '<div class="figgrid" style="grid-template-columns:repeat('+cols+',1fr)">'
        + item.fig.grid.map(c => figCell(c, 52)).join('') + '</div>';
    }
    $("question").innerHTML = figHtml;
    $("qmean").innerHTML = "";
    $("qja").innerHTML = noJa ? (ENG[item.cat] ? ENG[item.cat].ins : "") : brk(item.qja);
  } else if(item.fold){
    $("question").innerHTML = '<div class="figtarget"><div class="figcell">'+foldedPaperSVG(item.fold, 82)+'</div><div class="figtlabel">おって 穴を あけた かみ</div></div>';
    $("qmean").innerHTML = "";
    $("qja").innerHTML = noJa ? (ENG[item.cat] ? ENG[item.cat].ins : "") : brk(item.qja);
  } else if(item.comp){
    const cp = item.comp;
    let h = '';
    if(cp.kind === 'overlay'){
      h = '<div class="comprow">'
        + '<div class="figcell">'+compSVG(cp.a, 58)+'</div><span class="compop">＋</span>'
        + '<div class="figcell">'+compSVG(cp.b, 58)+'</div><span class="compop">＝</span>'
        + '<div class="figcell"><span class="figq">?</span></div></div>';
    } else {   // へんかん（回転・鏡・白黒反転）：れい と おなじ ように する
      h = '<div class="comprow"><span class="complbl">れい</span>'
        + '<div class="figcell">'+compSVG(cp.ex1, 50)+'</div><span class="compop">→</span>'
        + '<div class="figcell">'+compSVG(cp.ex2, 50)+'</div></div>'
        + '<div class="comprow"><span class="complbl">これは？</span>'
        + '<div class="figcell">'+compSVG(cp.q, 50)+'</div><span class="compop">→</span>'
        + '<div class="figcell"><span class="figq">?</span></div></div>';
    }
    $("question").innerHTML = '<div class="compq">'+h+'</div>';
    $("qmean").innerHTML = "";
    $("qja").innerHTML = noJa ? (ENG[item.cat] ? ENG[item.cat].ins : "") : brk(item.qja);
  } else if(noJa){
    if(item.stem){
      $("question").innerHTML = item.stem.map(w=>w.en).join('　　');
    } else if(item.astem){
      $("question").innerHTML = item.astem.map(t=> t.sep ? t.sep : (t.blank ? '□' : t.en)).join(' ');
    } else {
      $("question").innerHTML = item.q;
    }
    $("qmean").innerHTML = "";
    $("qja").innerHTML = ENG[item.cat] ? ENG[item.cat].ins : "";
  } else {
    if(item.stem){
      $("question").innerHTML = '<div class="stem">' + item.stem.map(w =>
        '<span class="wu"><ruby class="wru">'+w.en+'<rt>'+w.yomi+'</rt></ruby>'
        + '<span class="wja">'+w.ja+'</span></span>'
      ).join('') + '</div>';
      $("qmean").innerHTML = "";
    } else if(item.astem){
      $("question").innerHTML = '<div class="astem">' + item.astem.map(t => {
        if(t.sep) return '<span class="asep">'+t.sep+'</span>';
        if(t.blank) return '<span class="ablank">□</span>';
        return '<span class="au"><span class="ay">'+(t.yomi||'')+'</span>'
          + '<span class="ae">'+t.en+'</span>'
          + '<span class="am">'+(t.ja||'')+'</span></span>';
      }).join('') + '</div>';
      $("qmean").innerHTML = "";
    } else if(item.groups){
      $("question").innerHTML = '<span class="ngrp">'
        + item.groups.map(g=>'<span class="gbox">'+g+'</span>').join('') + '</span>';
      $("qmean").innerHTML = "";
    } else {
      $("question").innerHTML = item.q;
      $("qmean").innerHTML = item.mean || "";
    }
    $("qja").innerHTML = brk(item.qja);
  }
  $("question").className = (!item.fig && !item.fold && !item.comp && (noJa || (!item.stem && !item.astem))) ? "q fit" : "q";
  fitAll();
  const qEn = questionEnglish(item);   // 問題の 英単語（ことばの問題だけ ある）
  // 自動読み上げ・ホバー読み上げは しない（二重読み／別ページに 声が のこる／PCで 詰まる 原因になるため）。
  // 読み上げは 🔊ボタンだけ。タップで 1回だけ 女性の声で 読む。
  const hb = $("hearBtn");
  if(qEn){
    hb.classList.add("show");
    hb.onclick = () => { speak(qEn); hb.classList.add("playing"); setTimeout(()=>hb.classList.remove("playing"), 900); };
  }else{
    hb.classList.remove("show"); hb.onclick = null;
  }
  // 🔊「せんたくしを きく」ボタン：英語の 選択肢が ある とき（図形いがい）出して、英単語だけを じゅんに 読む（A・B・C は 読まない）。
  const hcb = $("hearChoicesBtn");
  if(!item.fig && item.choices.some(c => c && c.en)){
    const hcEns = item.choices.map(c => c && c.en).filter(Boolean).join(', ');
    hcb.classList.add("show");
    hcb.onclick = () => { speak(hcEns); hcb.classList.add("playing"); setTimeout(()=>hcb.classList.remove("playing"), 1400); };
  }else{
    hcb.classList.remove("show"); hcb.onclick = null;
  }
  $("count").textContent = (idx+1) + " / " + order.length;
  $("barfill").style.width = (idx / order.length * 100) + "%";

  const box = $("choices");
  box.className = "choices"; box.innerHTML = "";
  item.choices.forEach((c, i) => {
    const b = document.createElement("div");
    if(item.fig){
      b.className = "choice figchoice";
      b.innerHTML = '<span class="mk">'+marks[i]+'</span>' + figCell(c, 44);
      b.onclick = () => pick(i, b);
    } else if(item.fold){
      b.className = "choice figchoice";
      b.innerHTML = '<span class="mk">'+marks[i]+'</span>' + paperCell(c, item.fold.n || 4, 46);
      b.onclick = () => pick(i, b);
    } else if(item.comp){
      b.className = "choice figchoice";
      b.innerHTML = '<span class="mk">'+marks[i]+'</span>' + compCell(c, 46);
      b.onclick = () => pick(i, b);
    } else {
      b.className = "choice";
      const en = (!noJa && c.yomi) ? '<ruby>'+c.en+'<rt>'+c.yomi+'</rt></ruby>' : c.en;
      b.innerHTML = '<span class="mk">'+marks[i]+'</span>'
        + '<span class="ctxt"><span class="cen">'+en+'</span>'
        + ((!noJa && c.ja) ? '<span class="cja">'+c.ja+'</span>' : '') + '</span>';
      b.onclick = () => pick(i, b);
      b.title = 'おんどく：' + c.en;
      // ホバー読み上げは しない（マウスが 動くたび 二重読み・別ページ読みの 原因になるため）。読み上げは 🔊ボタンで。
    }
    box.appendChild(b);
  });

  $("explain").className = "explain"; $("explain").innerHTML = "";
  $("next").className = "next";
  $("next").innerHTML = (idx === order.length-1)
    ? "けっかを みる ›"
    : "つぎの<ruby>問題<rt>もんだい</rt></ruby>へ ›";
}

function pick(i, el){
  if(locked) return;
  locked = true;
  const item = QUESTIONS[order[idx]];
  const box = $("choices"); box.classList.add("locked");
  box.children[item.answer].classList.add("correct");
  const ex = $("explain");
  if(i === item.answer){
    score++;
    correctSound();                        // 正解：歓声
    ex.className = "explain good show";
    ex.innerHTML = brk("⭕️ せいかい！　" + (item.ex || "その ちょうし！"));
  }else{
    wrong.push(order[idx]);
    el.classList.add("wrong");
    wrongSound();                          // 不正解：ざんねん…
    ex.className = "explain bad show";
    ex.innerHTML = brk("こたえは「<b>"+((item.fig || item.fold || item.comp) ? marks[item.answer] : item.choices[item.answer].en)+"</b>」だよ。　" + (item.ex || "れい と 同じ ように かんがえてね。"));
  }
  $("barfill").style.width = ((idx+1) / order.length * 100) + "%";
  $("next").classList.add("show");
  // 選んだら すぐ「つぎへ」に カーソル（フォーカス）を 合わせる → そのまま Enter や クリックで 進める
  try{ $("next").focus({preventScroll:true}); }catch(e){ $("next").focus(); }
}

$("next").onclick = () => {
  if(idx < order.length-1){ idx++; render(); window.scrollTo(0,0); }
  else { showResult(); }
};

// ===== キーボードでも 進める（マウスを 動かさなくても いい）=====
// まだ 答えてない：1〜5（または A〜E）で 選択肢を えらぶ。
// 答えたあと：Enter / スペースで つぎへ（フォーカスが ボタンに あるので そのまま おせる）。→ ・n でも 進む。
document.addEventListener('keydown', (e) => {
  if($("result").classList.contains("show")) return;      // けっか画面は のぞく
  if($("quiz").style.display === "none") return;
  const box = $("choices");
  if(!locked){
    let sel = -1;
    if(/^[1-9]$/.test(e.key)) sel = parseInt(e.key, 10) - 1;
    else { const li = "abcde".indexOf(e.key.toLowerCase()); if(li >= 0) sel = li; }
    if(sel >= 0 && box.children[sel]){ e.preventDefault(); box.children[sel].click(); }
  }else{
    if(e.key === 'ArrowRight' || e.key.toLowerCase() === 'n'){ e.preventDefault(); $("next").click(); }
    // Enter / スペースは フォーカス中の ボタンが そのまま 進めてくれる
  }
});

let lastWrong = [];
function showResult(){
  $("quiz").style.display = "none";
  const r = $("result"); r.classList.add("show");
  const n = order.length;
  lastWrong = [...new Set(wrong)];
  $("retryWrong").style.display = lastWrong.length ? "" : "none";
  $("retryEn").style.display = noJa ? "none" : "";
  $("ennote").style.display = noJa ? "none" : "";
  $("resscore").innerHTML = n + "もん<ruby>中<rt>ちゅう</rt></ruby>　" + score + "もん せいかい！";
  let face="🎉", title="よくできました！", msg="";
  const rate = score / n;
  if(rate === 1){ face="🏆"; title="ぜんもん せいかい！"; msg="すごい！ レベルF ばっちり！"; }
  else if(rate >= 0.7){ face="🎉"; title="よくできました！"; msg="この ちょうし！ ほんばんレベルだよ。"; }
  else if(rate >= 0.4){ face="😊"; title="がんばったね！"; msg="まちがえた ことばを おぼえて、もう いちど！"; }
  else { face="💪"; title="つぎは できる！"; msg="かいせつを よんで、<br>ゆっくり もう いちど やろう。"; }
  $("resface").textContent = face;
  $("restitle").textContent = title;
  $("resmsg").innerHTML = msg;
}

function restart(newOrder){
  order = newOrder; wrong = []; idx = 0; score = 0;
  shuffleAllChoices();            // やりなおすたび いちも かわる
  $("result").classList.remove("show");
  $("quiz").style.display = "";
  render(); window.scrollTo(0,0);
}
$("again").onclick = () => restart(QUESTIONS.map((_, i) => i));
$("retryWrong").onclick = () => { if(lastWrong.length) restart([...lastWrong]); };
$("retryEn").onclick = () => { location.hash = '#en'; location.reload(); };

shuffleAllChoices();
render();

// ===== 日本語訳を かくす／つける トグル（やさしい＝訳あり版だけ 出す）=====
const jaToggle = $("jaToggle");
if(jaToggle){
  if(noJa){
    jaToggle.style.display = 'none';   // ほんばん（訳なし）版では 訳は もともと ないので ボタン不要
  }else{
    jaToggle.onclick = () => {
      const hidden = $("quiz").classList.toggle('hide-ja');
      jaToggle.classList.toggle('on', hidden);
      jaToggle.innerHTML = hidden
        ? '<ruby>日本語訳<rt>にほんごやく</rt></ruby>を つける 👀'
        : '<ruby>日本語訳<rt>にほんごやく</rt></ruby>を <ruby>隠<rt>かく</rt></ruby>す 🙈';
    };
  }
}

// ===== 最初の クリック／キーで 音声を 有効化（PCで 鳴らない のを 直す）=====
function unlockAudio(){
  try{
    if('speechSynthesis' in window){
      speechSynthesis.resume();
      const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u);
    }
  }catch(e){}
  window.removeEventListener('pointerdown', unlockAudio);
  window.removeEventListener('keydown', unlockAudio);
}
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('keydown', unlockAudio);
</script>
