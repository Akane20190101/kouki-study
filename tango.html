<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4d8bff">
<title>単語を覚えよう！</title>
<style>
  :root{
    --blue:#4d8bff;--blue-dark:#2f6ae0;--cream:#f4f9ff;--navy:#233047;
    --gray:#6b7488;--card:#ffffff;--line:#dbe7f7;--red:#e0455a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    background:var(--cream);color:var(--navy);line-height:1.5;
    min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom);
  }
  ruby{ruby-align:center;} rt{font-size:.5em;font-weight:600;color:var(--gray);user-select:none;}

  header{
    position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;
    padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
    background:var(--blue);color:#fff;box-shadow:0 2px 10px rgba(77,139,255,.25);
  }
  .back{
    display:flex;align-items:center;justify-content:center;width:34px;height:34px;
    border-radius:10px;background:rgba(255,255,255,.2);color:#fff;text-decoration:none;
    font-size:20px;font-weight:900;flex:none;
  }
  .htitle{font-size:16px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .home-btn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:1px 7px;border-radius:10px;background:rgba(255,255,255,.2);
    text-decoration:none;color:#fff;flex:none;
  }
  .home-btn .hb-ico{font-size:17px;line-height:1;}
  .home-btn .hb-txt{font-size:8px;font-weight:800;line-height:1.15;margin-top:1px;white-space:nowrap;}
  .home-btn:active{transform:scale(.9);}

  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px;}
  .intro{font-size:13px;color:var(--gray);font-weight:700;text-align:center;margin:4px 4px 8px;line-height:1.8;}

  .glabel{
    display:flex;align-items:center;gap:8px;
    font-size:14px;font-weight:800;color:var(--blue-dark);margin:22px 4px 12px;
  }
  .glabel::after{content:"";flex:1;height:1px;background:var(--line);}

  /* 幅に あわせて 列数が 自動で ふえる（PCでは 約10列・スマホでは 3〜4列）*/
  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(80px, 1fr));gap:7px;}
  .wc{
    position:relative;cursor:pointer;
    background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:9px 5px 8px;text-align:center;
    box-shadow:0 2px 6px rgba(35,48,71,.05);
    transition:transform .1s, border-color .15s, background .15s;
  }
  .wc:active{transform:scale(.95);}
  .wc .chk{
    display:none;position:absolute;top:4px;right:5px;
    width:18px;height:18px;border-radius:50%;background:#7ed957;color:#fff;
    font-size:12px;font-weight:900;line-height:1;
    align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .wc.checked{border-color:#7ed957;background:#f2ffe6;box-shadow:0 2px 10px rgba(126,217,87,.3);}
  .wc.checked .chk{display:flex;}

  .coin-bar{
    background:linear-gradient(90deg,#fff6d6,#fff0f6);
    border:2px solid #ffd76a;border-radius:16px;padding:10px 14px 12px;
    margin:2px 0 10px;text-align:center;
  }
  .coin-info{font-size:15px;font-weight:900;color:#8a6d1a;}
  .coin-info b{color:#e0952f;font-size:20px;}
  .candy-ico{vertical-align:-5px;}
  .buy-candy .candy-ico{vertical-align:-4px;}
  .coin-progress{height:8px;border-radius:999px;background:#ffe6a8;overflow:hidden;margin:8px auto 0;max-width:260px;}
  .coin-progress > i{display:block;height:100%;width:0;background:#ffb43a;border-radius:999px;transition:width .3s ease;}
  .buy-candy{
    background:#e6e9f0;color:#9aa5b6;border:none;border-radius:999px;
    font-size:11px;font-weight:800;padding:5px 10px;cursor:not-allowed;flex:none;
  }
  .buy-candy.ready{background:#ff6fae;color:#fff;cursor:pointer;box-shadow:0 3px 12px rgba(255,111,174,.4);}
  .buy-candy.ready:active{transform:scale(.97);}

  /* コンパクトな 上部バー（左：訳の切替 ／ 右：コイン小表示）*/
  .topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px;margin:2px 2px 10px;}
  .coin-mini{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;color:#8a6d1a;white-space:nowrap;}
  .coin-mini b{color:#e0952f;font-size:15px;}
  .ja-toggle-wrap{text-align:center;margin:2px 0 14px;}
  .ja-toggle{
    background:#eef3fb;border:2px solid var(--line);color:var(--navy);
    border-radius:999px;font-size:12px;font-weight:800;padding:6px 12px;cursor:pointer;
  }
  .ja-toggle.on{background:#f5a623;border-color:#f5a623;color:#fff;}
  .ja-toggle.on rt{color:rgba(255,255,255,.85);}
  .ja-toggle:active{transform:scale(.97);}
  #book.hide-ja .ja{display:none;}
  .wc .emoji{font-size:28px;line-height:1.1;}
  .wc .en{font-size:14px;font-weight:900;margin-top:3px;line-height:1.15;white-space:nowrap;}
  .wc .en rt{font-size:.5em;}
  .wc .ja{font-size:9px;color:var(--red);font-weight:700;margin-top:2px;line-height:1.2;}

  .btns{display:flex;flex-direction:column;gap:10px;margin-top:30px;}
  .btn{
    display:block;padding:16px;border-radius:16px;font-size:17px;font-weight:900;
    text-decoration:none;text-align:center;border:none;color:inherit;
  }
  .btn.primary{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(77,139,255,.3);}
  .btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line);}
  .btn:active{transform:scale(.99);}
  .ennote{font-size:11px;color:var(--red);font-weight:700;text-align:center;margin-top:-4px;}

  @media (prefers-color-scheme: dark){
    :root{--cream:#141a24;--navy:#eef3fb;--gray:#9aa5b6;--card:#1c2531;--line:#2c3849;--blue-dark:#8ab4ff;--red:#ff9aa6;}
    .btn.ghost{background:#1c2531;}
    .wc.checked{background:#1e3320;border-color:#5cb800;}
    .coin-bar{background:linear-gradient(90deg,#2a2617,#2a1a24);border-color:#8a6d1a;}
    .coin-info{color:#f0d17a;} .coin-info b{color:#ffcf5c;}
    .coin-progress{background:#3a3117;}
  }
  /* ===== パソコン（大きい画面）は 画面を ひろく使う ===== */
  @media (min-width: 760px){
    .wrap{max-width:1000px;}
    .htitle{font-size:18px;}
    .grid{gap:9px;}
    .wc .emoji{font-size:32px;}
    .wc .en{font-size:14px;}
    .wc .ja{font-size:10px;}
    .btns{max-width:520px;margin-left:auto;margin-right:auto;}
    .intro{font-size:15px;}
  }
</style>
</head>

<header>
  <a class="back" href="index.html">‹</a>
  <div class="htitle">🔤 <ruby>単語<rt>たんご</rt></ruby>を<ruby>覚<rt>おぼ</rt></ruby>えよう！</div>
  <a class="home-btn" href="index.html">

// ===== 音読（英語を ネイティブの声で 読み上げ）=====
let enVoice = null;
function pickEnVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    // アメリカ英語(en-US)の 女性の声だけ えらぶ（いつも 同じ 女性が 読むように。renshu.html と そろえる）。
    const isUS = v => /en[-_]US/i.test(v.lang);
    const FEMALE = /Samantha|Ava|Allison|Susan|Zoe|Nicky|Joelle|Kathy|Vicki|Victoria|Zira|Aria|Jenny|Michelle|Google US English/i;
    const MALE = /David|Mark|Guy|Eric|Tom|Alex|Fred|Evan|Nathan|Aaron|Daniel|Oliver|James|Bruce|Lee|Reed|Rocko|Junior|Ralph|Albert|Arthur|Gordon/i;
    const NOVELTY = /Bad News|Good News|Bahh|Boing|Bells|Bubbles|Cellos|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Grandma|Grandpa|Sandy|Shelley|Flo|Eddy|ささやき|オルガン|スーパースター|トリノイド|ベル|道化|震え/i;
    enVoice = vs.find(v => isUS(v) && /Samantha/i.test(v.name))
           || vs.find(v => isUS(v) && FEMALE.test(v.name))
           || vs.find(v => isUS(v) && !MALE.test(v.name) && !NOVELTY.test(v.name))
           || vs.find(v => /^en/i.test(v.lang) && FEMALE.test(v.name))
           || vs.find(v => isUS(v))
           || null;
  }catch(e){}
}
pickEnVoice();
try{
  if('speechSynthesis' in window){
    speechSynthesis.onvoiceschanged = pickEnVoice;
    setInterval(() => { try{ if(speechSynthesis.speaking) speechSynthesis.resume(); }catch(e){} }, 4000);
  }
}catch(e){}
// デスクトップで 音が 出ない 既知バグを つぶした 読み上げ（renshu.html と そろえる）:
//  ①utterance を つかまえて GC消滅を 防ぐ ②声指定で失敗→既定の声で再挑戦 ③声リストが空なら待つ
const _uKeep = [];
function _rawSpeak(text, useVoice){
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    if(useVoice && enVoice) u.voice = enVoice;
    u.rate = 0.9;
    const drop = () => { const i = _uKeep.indexOf(u); if(i >= 0) _uKeep.splice(i, 1); };
    u.onend = drop;
    u.onerror = drop;                     // 失敗しても 別の声で 読み直さない（二重読み・別人声を ふせぐ）
    _uKeep.push(u);
    speechSynthesis.speak(u);
  }catch(e){}
}
function speak(text){
  try{
    if(!('speechSynthesis' in window) || !text) return;
    if(!enVoice) pickEnVoice();
    try{ speechSynthesis.resume(); }catch(e){}
    const run = () => { if(!enVoice) pickEnVoice(); _rawSpeak(text, true); };
    if(!speechSynthesis.getVoices().length){ setTimeout(run, 200); return; }
    if(speechSynthesis.speaking || speechSynthesis.pending){
      speechSynthesis.cancel();
      setTimeout(run, 140);
    }else{
      run();
    }
  }catch(e){}
}

    }

  window.removeEventListener('keydown', unlockAudio);
}

// ===== サウンド =====
let actx;
function ctx(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
function note(f, t, dur, vol, type){
  const c = ctx();
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle';
  o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function coinSound(){                          // チェック：マリオのコイン
  try{
    const c = ctx(); const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(987.77, t);
    o.frequency.setValueAtTime(1318.51, t + 0.07);
    g.gain.setValueAtTime(0.12, t);
    g.gain.setValueAtTime(0.12, t + 0.07);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.42);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.44);
  }catch(e){}
}
function uncheckSound(){                        // チェックを外す：やわらかい下降音
  try{
    const c = ctx(); const t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(520, t);
    o.frequency.exponentialRampToValueAtTime(300, t + 0.14);
    g.gain.setValueAtTime(0.09, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.2);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.22);
  }catch(e){}
}
function cheer(){                               // 1れつ コンプリート：「いえーい！」の 歓声
  try{
    const c = ctx(); const base = c.currentTime;
    // よろこびの メロディ
    [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) =>
      note(f, base + i * 0.09, 0.3, 0.15, 'triangle'));
    // 「いえーい」風の 歓声（ホワイトノイズの もりあがり＝拍手・かんせい）
    const dur = 0.75;
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.6;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, base);
    g.gain.exponentialRampToValueAtTime(0.1, base + 0.18);
    g.gain.exponentialRampToValueAtTime(0.0008, base + dur);
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(base); src.stop(base + dur);
  }catch(e){}
}
function buySound(){                            // コットンキャンディを かう：うれしいキラキラ
  try{
    const base = ctx().currentTime;
    [783.99, 1046.50, 1318.51, 1567.98, 2093.00].forEach((f, i) =>
      note(f, base + i * 0.07, 0.3, 0.15, 'triangle'));
  }catch(e){}
}

function updateCoinBar(){
  const cc = document.getElementById('coinCount');
  const cy = document.getElementById('candyCount');
  const fill = document.getElementById('coinFill');
  const buy = document.getElementById('buyCandy');
  if(cc) cc.textContent = coins;
  if(cy) cy.textContent = candy;
  if(fill) fill.style.width = Math.min(100, (coins % CANDY_COST) / CANDY_COST * 100) + '%';
  if(buy){
    const ready = coins >= CANDY_COST;
    buy.disabled = !ready;
    buy.classList.toggle('ready', ready);
  }
}

    c.className = 'wc' + (learned[w.en] ? ' checked' : '');

    c.onclick = () => {
      speak(w.en);                                          // タップ／クリックで 女性の声で 1回 音読
      const nowOn = !learned[w.en];
      learned[w.en] = nowOn;
      c.classList.toggle('checked', nowOn);
      if(nowOn){
        coins += PER_WORD;
        coinSound();                                          // チェックは かならず コイン音
        const groupDone = g.words.every(x => learned[x.en]);  // よこ1れつ ぜんぶ チェック
        if(groupDone) setTimeout(cheer, 260);                 // そろったら コイン音の あとに「いえーい！」
      } else {
        coins = Math.max(0, coins - PER_WORD);
        uncheckSound();
      }
      saveAll();
      updateCoinBar();
    };
    grid.appendChild(c);
  });
  sec.appendChild(grid);
  book.appendChild(sec);
});

// ===== 英単語が セルから はみ出ない／消えないよう、はばに あわせて 文字サイズ調整 =====
function fitWords(){
  document.querySelectorAll('#book .en').forEach(en => {
    en.style.whiteSpace = 'nowrap';
    en.style.wordBreak = '';
    en.style.fontSize = '';
    if(!en.clientWidth) return;                     // まだ 表示前なら さわらない（消え防止）
    let size = parseFloat(getComputedStyle(en).fontSize) || 14;
    let guard = 0;
    while(en.scrollWidth > en.clientWidth + 0.5 && size > 9 && guard < 30){
      size -= 0.5; en.style.fontSize = size + 'px'; guard++;
    }
    if(en.scrollWidth > en.clientWidth + 0.5){       // それでも収まらなければ 折り返す（必ず表示）
      en.style.whiteSpace = 'normal';
      en.style.wordBreak = 'break-word';
    }
  });
}
window.addEventListener('load', fitWords);           // 画像・フォント読み込み後に 確実に実行
